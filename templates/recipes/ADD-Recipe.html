{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add Recipe - Piece of Cake</title>
    <link rel="stylesheet" href="{% static 'css/Add_recipe.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <img src="{% static 'images/Cake_Logo.png' %}" alt="Logo">
        <div class="nav-links">
            <a href="{% url 'home' %}"><i class="fa-solid fa-house"></i>Home</a>
            <a href="{% url 'recipe_list' %}"><i class="fa-solid fa-utensils"></i>Recipes</a>
            {% if user.is_authenticated and not user.is_staff %}
                <a href="{% url 'favorites' %}"><i class="fa-solid fa-heart"></i>Favorites</a>
            {% endif %}
            <a href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i>Logout</a>
        </div>
    </nav>

    <hr>
    <h1> Add Recipe </h1>
    <hr>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %} <div>
            <label for="RecipeName">Recipe Name: </label><br>
            <input id="RecipeName" type="text" name="title" placeholder="Enter Name of Recipe" required><br><br>
        </div>

        <div>
            <label for="namecourse">Course Name: </label><br>
            <input id="namecourse" list="CourseName" name="category" placeholder="Choose Course" />
            <datalist id="CourseName">
                <option value="Appetizers">
                <option value="Main Course">
                <option value="Dessert">
            </datalist><br><br>
        </div>

        <div>
            <label for="description"> Recipe Description: </label><br>
            <textarea id="description" name="instructions" cols="80" rows="10"
             placeholder="Step-by-step instructions..." required></textarea><br><br>
        </div>

        <hr>
        <h2>Ingredients</h2>
        <hr>

        <div style="margin-bottom: 10px;">
            <label for="ingredients_text">List Ingredients (comma separated):</label><br>
            <textarea id="ingredients_text" name="ingredients" cols="80" rows="5"
            placeholder="e.g. 2 cups Flour, 1 tsp Sugar, 3 Eggs" required></textarea>
        </div>

        <table border="2" id="ingredientsTable">
            <thead>
                <tr>
                    <th>Ingredient Name</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="text" name="ing_name" placeholder="Name"></td>
                    <td><input type="text" name="ing_qty" placeholder="Qty"></td>
                </tr>
            </tbody>
        </table>

        <div class="table-controls">
            <button type="button" id="addRow">➕ Add Ingredient</button>
            <button type="button" id="removeRow">➖ Remove Last</button>
        </div>

        <hr>
        <div class="upload-container">
            <label for="file-upload" class="custom-file-upload">
                <span>📁 Click to Upload Recipe Image</span>
            </label>
            <input id="file-upload" type="file" name="image" accept="image/*">
        </div>

        <br>
        <hr><br>
        <button type="submit" class="btn-submit">Add Recipe</button>
        <input type="reset" value="Reset">
    </form>

    <script src="{% static 'js/Add_recipe.js' %}"></script>
    <footer>&copy; 2026 Piece of Cake.</footer>
</body>
</html>
