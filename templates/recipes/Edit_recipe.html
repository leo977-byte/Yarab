{% load static %}
<!DOCTYPE html>
<html lang="en">  
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Recipe - Admin</title>

  <link rel="stylesheet" href="{% static 'css/Edit_recipe.css' %}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <img class="nav-logo" src="{% static 'images/Cake_Logo.png' %}">

  <div class="nav-links">
    <a href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
    <a href="{% url 'recipe_list' %}"><i class="fa-solid fa-utensils"></i> Recipes</a>
    <a href="{% url 'add_recipe' %}"><i class="fa-solid fa-plus"></i> Add Recipe</a>
    <a href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </div>
</nav>

<!-- PAGE -->
<div class="page-wrapper">
  <div class="card">

    <div class="card-header">
      <h1>Edit Recipe</h1>
      <p>Admin Panel · Update recipe details below</p>
    </div>

    <div class="card-body">

      <!-- FORM -->
      <form method="POST" action="{% url 'edit_recipe' recipe.pk %}" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Recipe Title -->
        <div class="field-group">
          <label>Recipe Name</label>
          <input type="text" name="title" value="{{ recipe.title }}" required>
        </div>

        <!-- Category -->
        <div class="field-group">
          <label>Course Name</label>
          <select name="category" required>
            <option value="main_course" {% if recipe.category == "main_course" %}selected{% endif %}>
              Main Course
            </option>

            <option value="dessert" {% if recipe.category == "dessert" %}selected{% endif %}>
              Dessert
            </option>

            <option value="appetizer" {% if recipe.category == "appetizer" %}selected{% endif %}>
              Appetizer
            </option>
          </select>
        </div>

        <!-- Instructions -->
        <div class="field-group">
          <label>Instructions</label>
          <textarea name="instructions" required>{{ recipe.instructions }}</textarea>
        </div>

        <!-- Image -->
        <div class="field-group">
          <label>Recipe Image</label>
          <input type="file" name="image">
          {% if recipe.image %}
            <p>Current Image: <img src="{{ recipe.image.url }}" width="100"></p>
          {% endif %}
        </div>

        <!-- INGREDIENTS -->
        <div class="section-title">
          <h2>Ingredients</h2>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ingredient Name</th>
                <th>Quantity</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="ingredients_table">

              {% for ing in recipe.ingredients.all %}
              <tr>
                <td>
                  <input type="text" name="ingredient_name[]" value="{{ ing.name }}" required>
                </td>

                <td>
                  <input type="text" name="ingredient_qty[]" value="{{ ing.quantity }}" required>
                </td>

                <td>
                  <button type="button" class="btn btn-remove" onclick="removeRow(this)">
                    ✕ Remove
                  </button>
                </td>
              </tr>
              {% endfor %}

            </tbody>
          </table>
        </div>

        <!-- Add Ingredient -->
        <button type="button" class="btn btn-add" onclick="addIngredient()">
          ＋ Add Ingredient
        </button>

        <!-- ACTIONS -->
        <div class="actions">
          <button type="submit" class="btn btn-save">💾 Save Changes</button>
          <button type="reset" class="btn btn-reset">↺ Reset</button>

          <a href="{% url 'recipe_list' %}">
            <button type="button" class="btn btn-cancel">✕ Cancel</button>
          </a>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="{% static 'js/Edit_recipe.js' %}"></script>

</body>
</html>
